    <!-- Install App Button -->
<button id="installBtn" style="display:none; position:fixed; bottom:10rem; right:5px; z-index:1000; padding:10px 16px; background:#98c0f8; color:white; border:none; border-radius:8px; font-weight:bold;">

<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js')
        .then(reg => console.log('ServiceWorker registered', reg))
        .catch(err => console.log('ServiceWorker registration failed:', err));
    });
}
</script>

<!-- PWA Installation Handler -->
<script>
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
        if (window.matchMedia('(display-mode: standalone)').matches) {
            alert("App already installed!");
        } else {
            alert("PWA installation not supported");
        }
        return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('User choice:', outcome);
    installBtn.style.display = 'none';
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    console.log('PWA installed');
    installBtn.style.display = 'none';
});

// Hide button if already standalone
if (window.matchMedia('(display-mode: standalone)').matches) {
    installBtn.style.display = 'none';
}
</script>

<!-- Link manifest for PWA -->

<!-- GLOBAL SMOKE BACKGROUND (White & Brownish) -->
<canvas id="globalSmokeCanvas"></canvas>
<script>
(function() {
    const canvas = document.getElementById('globalSmokeCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    class SmokeParticle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + (Math.random() * 100);
            this.size = Math.random() * 80 + 40;
            this.speedY = -(Math.random() * 1.2 + 0.3);
            this.speedX = (Math.random() - 0.5) * 1.5;
            this.opacity = Math.random() * 0.15 + 0.05; // Light opacity
            
            // White and brownish smoke colors
            const type = Math.random();
            if (type > 0.6) {
                // Brownish
                this.color = 'rgba(180, 130, 90,'; 
            } else if (type > 0.3) {
                // Cream/White
                this.color = 'rgba(240, 235, 225,';
            } else {
                // Darker brown
                this.color = 'rgba(100, 70, 50,';
            }
            
            this.life = 0;
            this.maxLife = Math.random() * 500 + 200;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(this.life * 0.02) * 0.8;
            this.life++;
            this.size += 0.3;
            if (this.y < -this.size || this.life > this.maxLife) this.reset();
        }
        draw() {
            const prog = this.life / this.maxLife;
            const alpha = this.opacity * (1 - prog);
            ctx.beginPath();
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
            gradient.addColorStop(0, this.color + alpha + ')');
            gradient.addColorStop(1, this.color + '0)');
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }
    }

    for (let i = 0; i < 40; i++) particles.push(new SmokeParticle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
})();
</script>
